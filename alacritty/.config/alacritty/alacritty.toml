[general]
live_config_reload = true
import = ["gruvbox-dark.toml"]

[env]
TERM = "xterm-256color"

[selection]
save_to_clipboard = true

[window]
padding = { x = 10, y = 10 }
opacity = 1.0
# decorations = "None"

[scrolling]
history = 5000

[font]
size = 13

[font.normal]
family = "Iosevka Term"
style = "Regular"

[font.bold]
family = "Iosevka Term"
style = "Bold"

[font.italic]
family = "Iosevka Term"
style = "Italic"

[font.bold_italic]
family = "Iosevka Term"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[colors.cursor]
cursor = "#ebdbb2"
text = "#282828"

[bell]
animation = "EaseOutExpo"
duration = 0
