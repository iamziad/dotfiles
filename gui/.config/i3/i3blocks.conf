separator_block_width=15
markup=none
color=#f5f5f5

[mediaplayer]
command=~/.config/i3/scripts/i3blocks/mediaplayer/mediaplayer
# label=󰝚
color=#c0c0c0
instance=spotify
interval=5
signal=10

[org-timer]
command=~/.config/i3/scripts/i3blocks/org-timer
interval=1
color=#d8a657

# [bandwidth]
# command=INLABEL=' ' OUTLABEL='- ' TREAT_UNKNOWN_AS_UP=0 $SCRIPT_DIR/bandwidth/bandwidth
# markup=pango
# interval=5
# INTERFACE=enp3s0
# TREAT_UNKNOWN_AS_UP=0


[ethernet.sh]
command=~/.config/i3/scripts/i3blocks/ethernet.sh
interval=5

[memory]
command=~/.config/i3/scripts/i3blocks/memory/memory
# label=MEM:
instance=mem
separator=true
interval=10

# [cpu_usage]
# command=LABEL='CPU: ' T_WARN=65 T_CRIT=80 COLOR_NORMAL='#EBDBB2' COLOR_WARN='#FFFC00' COLOR_CRIT='#FF0000' $SCRIPT_DIR/cpu_usage/cpu_usage
# interval=10
# separator=false

[load]
command=~/.config/i3/scripts/i3blocks/load
interval=5
separator=true

[temperature]
command=T_WARN=60 T_CRIT=70 ~/.config/i3/scripts/i3blocks/temperature/temperature
interval=10

# [cpu_temperature]
# label=
# command=echo "$(( $(cat /sys/class/hwmon/hwmon1/temp1_input) / 1000 ))°C"
# interval=5

[disk]
command=df -B1 / | awk 'NR==2 {printf "%.1fG\n", $4/1024/1024/1024}'
interval=30

[volume]
command=~/.config/i3/scripts/i3blocks/volume
markup=pango
interval=once
signal=10
# STEP=5%

[mic]
command=~/.config/i3/scripts/i3blocks/mic
interval=2
signal=10

[time]
command=date '+%a %d %b - %H:%M'
interval=5

[xkb_layout]
command=font=monospace font_weight=regular ~/.config/i3/scripts/i3blocks/xkb_layout/xkb_layout
interval=persist
markup=pango
# color=#0492c2
